l_english:
 news.10.t:0 "No Longer Human"
 news.10.d:0 "The plague appeared in the Midwest soon after the news from New Mexico. The current civil unrest in the Twin Cities and Chicago only appeared to amplify the spread of the already ruthless contagion. The first day saw coughing. By the third day, the disease had deteriorated to the point of blackening finger tips, swollen lymph nodes so large the patient becomes unreconginzeable, blood seeping from the eys, coughing so strong that bits of internal organs begin to spill. By the fifth? They were no longer human.\nThe 'Black Summer' plague killed swaths, turning their corpses into the running, ravenous dead."
 news.10.a:0 "The Fate of Iowa"
 news.12.t:0 "Fate of Iowa"
 news.12.d:0 "Unlike her North and Eastern neighbors, Iowa was spared the worst of the Black Summer. Federal authorities, operating under the FEMA were able to collaborate with state officals to curb the expansion of the plague in Des Moines and Cedar Rapids.However, with the collapse of Washington D.C, Iowa was left on her own. State Authority quickly crumbled against the new reality, and even FEMA began to operate against Des Moines. In December 2040, the state of Iowa collapses into anarchy, as waves of 'Zombies', as colloquially named, began to surge unexpectedly across state lines."
 news.12.a:0 "What are we left with?"
 news.13.t:0 "12 Years Later"
 news.13.d:0 "The Midwest stands at a knife's edge. Black Summer is in it's twilight. In it's place has sprung up new nations, ideas and ambitions. Civilization's torch, while dimmed, remains alight. Industrialization, which was thought to be wiped out, has begun again. But with civilization comes conflict. While Black Summer has faded into fall, warfare rides ontop of a blood red horse."
 news.13.a:0 "I have a world to save."
 news.20.t:0 "Duluth Stands!"
 news.20.d:0 "The 62 day siege of Duluth has finally come to an end. The Canadian Army, led by General Barkley have began to withdraw from the city suburbs, falling back to more defensible positions up north. The momentum has shifted back into the hands of the Northern Alliance. It seems like the Great Lake will remain American for now."
 news.20.a:0 "The North has stood their ground."
 news.21.t:0 "The Fall of Duluth"
 news.21.d:0 "The 62 day siege of Duluth has finally come to an end. The Canadian Army, led by General Barkley have claimed victory after driving out most of the Northern Alliance out of the city. Isolated remanants still fight on, but the fight is over. The North still has a sizeable presence in northern Winsconsin, but for how much longer remains to be seen. It seems like the Great Lakes have fallen under Canadian control."
 news.21.a:0 "The North has crumbled."
 news.30.t:0 "Fall of Jefferson City"
 news.30.d:0 "Disaster has struck in North Missouri. Jefferson City, the gate that held the undead at bay, has been broken. Unexpectedly, the undead began infiltrating the city's defensives in the thousands. The attack caught most of the city by suprise. Many senior officals are missing, and only a small portion of the city's inhabitants were able to evacuate unharmed. North Missourian forces are reeling from this devastating attack. It seems like the shield in the south has been broken."
 news.30.t:0 "This is impossible!"
 news.40.t:0 "Fall of Houston"
 news.40.d:0 "Texas, one of the few remaining state governments still operating at a regional level, has suffered a major blow. The undead have overran the capital, Houston earlier this week. The battered Texan government has begun retreated eastwards, hoping to find some reprieve from this unusual offensive. Texan Army units have withdraw in good order, but the civilian exodus from Houston has been nothing short of a calamity. The missing number in the tens of thousands."
 news.40.a:0 "Texas will not give up so easily."
 news.50.t:0 "The Fate of Missouri"
 news.50.d:0 "After Jefferson City, the flood of refugees from Northern Missouri have been damn near crippling. Life in the post-apocalpyse is difficult at best. The extra mouths to feed are an unpleasant burden. However, the sheer number of them makes it difficult to ward away. Unfortunately, former North Missourian military units have begun showing up at our doorstep as well. Many of them lack gear, and are stark white with fear, but they'll fight if we feed them. While this may seem good, if we are beginning to receive what's left of North Missouri's military, it won't be long until the undead will stream in after them. Furthermore, disturbing reports from these soldiers suggest that the zombies are acting in a coordinated manner..."
 news.50.a:0 "We must see to our defenses."
 news.51.t:0 "First Contact"
 news.51.d:0 "At first, the zombies were just droplets. A dozen more than the regular sightings. Nothing a patrol can't handle. But everyone from the lowliest soldier to the highest General can see where this is going. Undead sightings have been rising dramatically. Patrols would only typically only engage a few dozen. Now? Groups ranging from hundreds to even thousands of undead have begun to make contact at our defenses. For many, it brings back bad memories after the fall of the state government. For now, our borders will hold. But what of tommorow?"
 news.51.a:0 "Winter is coming."


 